<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha Dev — Plano de estudos para programadores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f2f5fb;--sf:#ffffff;--tx:#10203a;--mu:#5a6781;--bd:#dbe2f0;--ac:#2f6bff;--acs:#e6eeff;--ok:#12a36b;--sun:#ffc93c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1426;--sf:#142039;--tx:#e8eefb;--mu:#9aa8c7;--bd:#25345a;--ac:#6b95ff;--acs:#1b2c55;--ok:#34d399;--sun:#ffd25a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1426;--sf:#142039;--tx:#e8eefb;--mu:#9aa8c7;--bd:#25345a;--ac:#6b95ff;--acs:#1b2c55;--ok:#34d399;--sun:#ffd25a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:860px;margin:0 auto;padding:40px 20px 64px}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em;max-width:16ch}
header p{color:var(--mu);max-width:58ch;margin:16px 0 0;font-size:1.05rem}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:32px 0 8px}
.area{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--sf);border:2px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
.area:hover{border-color:var(--ac)}
.area[aria-pressed="true"]{border-color:var(--ac);background:var(--acs)}
.area .em{font-size:1.7rem;line-height:1}
.area b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem}
.area span.d{display:block;color:var(--mu);font-size:.88rem;line-height:1.35;margin-top:2px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#plan{margin-top:40px}
.top{display:flex;flex-wrap:wrap;gap:20px 32px;justify-content:space-between;align-items:flex-end}
.top h2{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800}
.top p{margin:8px 0 0;color:var(--mu);max-width:50ch}
.prog{min-width:200px;flex:1 1 200px;max-width:280px}
.prog strong{font:800 2.4rem/1 'Bricolage Grotesque',sans-serif}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .35s}
.prog small{color:var(--mu)}
.meta{display:grid;gap:14px;margin:24px 0 8px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.meta h3{font-size:.95rem;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--acs);color:var(--ac);font-weight:700;font-size:.88rem;padding:4px 12px;border-radius:99px}
.meta p{margin:0;color:var(--mu);font-size:.95rem}
.trail{position:relative;margin-top:28px;padding-left:52px}
.line{position:absolute;left:19px;top:20px;bottom:20px;width:4px;background:var(--bd);border-radius:4px}
.line i{display:block;width:100%;height:0;background:var(--sun);border-radius:4px;transition:height .45s}
.st{position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px 18px 12px;margin-bottom:16px}
.node{position:absolute;left:-52px;top:14px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sf);border:3px solid var(--bd);font:800 1.05rem 'Bricolage Grotesque',sans-serif;transition:background .2s,border-color .2s}
.st[data-done="1"] .node{background:var(--ok);border-color:var(--ok);color:#fff}
.st[data-done="1"]{border-color:var(--ok)}
.st h3{font-size:1.25rem}
.st .t{color:var(--mu);font-size:.9rem;margin:2px 0 10px}
.st ul{list-style:none;margin:0;padding:0}
.st li+li{border-top:1px solid var(--bd)}
.st label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.st input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.st input:checked+span{color:var(--mu);text-decoration:line-through}
.rs{font:inherit;font-weight:700;color:var(--mu);background:none;border:1px solid var(--bd);border-radius:10px;padding:10px 16px;cursor:pointer;margin-top:8px}
.rs:hover{color:var(--tx);border-color:var(--mu)}
.win{display:none;background:var(--sun);color:#10203a;border-radius:14px;padding:20px;margin-top:8px}
.win h2{font-size:1.4rem;font-weight:800}
.win p{margin:6px 0 12px}
.win ol{margin:0;padding-left:22px;display:grid;gap:8px}
.win.on{display:block}
.sal{margin-top:16px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.sal h3{font-size:1.05rem;margin-bottom:12px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sg div{background:var(--acs);border-radius:10px;padding:12px}
.sg small{display:block;color:var(--mu);font-size:.85rem}
.sg b{display:block;font:800 1.15rem/1.25 'Bricolage Grotesque',sans-serif;margin-top:2px}
.sal p{margin:12px 0 0;color:var(--mu);font-size:.88rem}
.rec{margin:36px 0 20px}
.rec h2{font-size:1.5rem;font-weight:800}
.rec>p{color:var(--mu);margin:6px 0 16px;max-width:58ch}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.rc h3{font-size:1.05rem;margin-bottom:10px}
.rc ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rc a{color:var(--ac);font-weight:700;text-decoration:none}
.rc a:hover{text-decoration:underline}
.rc li span{display:block;color:var(--mu);font-size:.88rem;line-height:1.4}
@media (max-width:520px){main{padding:28px 16px 48px}.trail{padding-left:46px}.node{left:-46px;width:38px;height:38px}.line{left:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>Qual área de programação é o seu sonho?</h1>
  <p>Escolha uma área e veja o caminho: linguagens, ferramentas e projetos que você precisa dominar para trabalhar com isso. Marque o que já aprendeu e acompanhe seu progresso.</p>
</header>

<section class="areas" id="areas" aria-label="Áreas de programação"></section>

<section id="plan" hidden>
  <div class="top">
    <div><h2 id="pn"></h2><p id="pd"></p></div>
    <div class="prog" aria-live="polite"><strong id="pp">0%</strong><div class="bar"><i id="pb"></i></div><small id="pc"></small></div>
  </div>
  <div class="meta">
    <div><h3>Linguagens e tecnologias principais</h3><div class="chips" id="pl"></div></div>
    <p id="pj"></p>
  </div>
  <div class="sal" id="sal"></div>
  <div class="trail" id="tr"><div class="line"><i id="lf"></i></div></div>
  <section class="win" id="win" aria-live="polite"></section>
  <section class="rec" id="rec" aria-label="Estude de graça"></section>
  <button class="rs" id="rs" type="button">Zerar o progresso desta área</button>
</section>
</main>

<script>

  games: { nome:"Jogos", em:"🎮", curto:"Criação de jogos 2D, 3D e experiências interativas.",

    etapas:[

const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
const ch = (n, d, q) => [n, yt(q || n), d];
const REC = {

  back: {

    sites: [["roadmap.sh/backend","https://roadmap.sh/backend","Mapa visual do que estudar em back-end."],["SQLBolt","https://sqlbolt.com/","Aprenda SQL com exercícios interativos."],["Exercism","https://exercism.org/","Exercícios com feedback em várias linguagens."]],

const li = x => `<li><a href="${x[1]}" target="_blank" rel="noopener noreferrer">${x[0]}</a><span>${x[2]}</span></li>`;
function renderRec() {
  const r = REC[cur];

}
const PROJ = {
  front: "Publique online pelo menos 3 projetos: uma landing page, um app de tarefas com JavaScript ou React e um clone de um site conhecido (Vercel, Netlify ou GitHub Pages).",
  back: "Crie uma API REST completa com login, banco de dados e documentação, rodando na nuvem, e deixe o código no GitHub.",
  mobile: "Termine 2 apps completos, com login e consumo de API, e publique (ou deixe prontos para publicar) na Play Store ou na App Store.",
  dados: "Publique 3 análises no GitHub ou no Kaggle, incluindo um projeto de ponta a ponta com modelo de machine learning e dashboard.",
  devops: "Monte um pipeline CI/CD completo com Docker e Terraform que sobe uma aplicação na nuvem, e documente cada etapa no GitHub.",
  games: "Publique 3 jogos jogáveis no itch.io, sendo um deles feito em uma game jam."
};
function renderWin() {
  const a = AREAS[cur];
  if (!a) return;
  const steps = [
    ["Monte seu portfólio", PROJ[cur]],
    ["Organize o GitHub e o LinkedIn", "Coloque um README claro em cada projeto e liste no perfil as tecnologias que você domina."],
    ["Faça um currículo de uma página", "Destaque seus projetos e as tecnologias usadas. Se puder, tenha também uma versão em inglês."],
    ["Candidate-se toda semana", "Procure vagas e estágios de nível júnior. Você não precisa dominar tudo o que a vaga lista."],
    ["Treine para entrevistas", "Pratique lógica de programação e explicar seus projetos em voz alta, como se estivesse falando com o recrutador."],
    ["Ganhe experiência extra", "Faça freelas, contribua com projetos open source e participe de comunidades e hackathons."],
    ["Continue estudando", "Melhore seu inglês técnico e escolha uma segunda tecnologia para se aprofundar."]
  ];
  $('win').innerHTML = `<h2>🎉 Trilha completa! E agora?</h2><p>Você concluiu todos os tópicos de ${a.nome}. Agora é hora de transformar o que aprendeu em oportunidade:</p><ol>${steps.map(s => `<li><b>${s[0]}.</b> ${s[1]}</li>`).join('')}</ol>`;
}
const $ = id => document.getElementById(id);
let cur = null, done = {};
try { cur = localStorage.getItem('trilha_area') || null; done = JSON.parse(localStorage.getItem('trilha_done') || '{}'); } catch (e) {}
if (cur && !AREAS[cur]) cur = null;
function save() { try { localStorage.setItem('trilha_area', cur || ''); localStorage.setItem('trilha_done', JSON.stringify(done)); } catch (e) {} }

function renderAreas() {
  $('areas').innerHTML = Object.entries(AREAS).map(([k, a]) =>
    `<button class="area" type="button" data-k="${k}" aria-pressed="${k === cur}"><span class="em" aria-hidden="true">${a.em}</span><span><b>${a.nome}</b><span class="d">${a.curto}</span></span></button>`
  ).join('');
}

function renderPlan() {
  const a = AREAS[cur];
  $('plan').hidden = !a;
  if (!a) return;
  $('pn').textContent = a.nome;
  $('pd').textContent = a.desc;
  $('pl').innerHTML = a.langs.map(l => `<span class="chip">${l}</span>`).join('');
  renderRec();
  renderSal();
  renderWin();
  $('pj').textContent = `Tempo estimado: ${a.tempo}. Você pode trabalhar como: ${a.cargos}.`;
  const tr = $('tr');
  tr.querySelectorAll('.st').forEach(n => n.remove());
  a.etapas.forEach((e, si) => {
    const el = document.createElement('article');
    el.className = 'st';
    el.dataset.s = si;
    el.innerHTML = `<span class="node">${si + 1}</span><h3>${e.n}</h3><p class="t">${e.t}</p><ul>` +
      e.i.map((txt, ii) => `<li><label><input type="checkbox" data-k="${cur}:${si}:${ii}" ${done[`${cur}:${si}:${ii}`] ? 'checked' : ''}><span>${txt}</span></label></li>`).join('') + `</ul>`;
    tr.appendChild(el);
  });
  update();
}

function update() {
  const a = AREAS[cur];
  if (!a) return;
  let total = 0, ok = 0;
  a.etapas.forEach((e, si) => {
    let all = true;
    e.i.forEach((_, ii) => { total++; if (done[`${cur}:${si}:${ii}`]) ok++; else all = false; });
    const el = $('tr').querySelector(`.st[data-s="${si}"]`);
    if (el) el.dataset.done = all ? '1' : '0';
  });
  const pct = Math.round(ok / total * 100);
  $('pp').textContent = pct + '%';
  $('pb').style.width = pct + '%';
  $('lf').style.height = pct + '%';
  $('pc').textContent = `${ok} de ${total} tópicos concluídos`;
  $('win').classList.toggle('on', pct === 100);
}

$('areas').addEventListener('click', ev => {
  const b = ev.target.closest('.area');
  if (!b) return;
  cur = b.dataset.k;
  save(); renderAreas(); renderPlan();
  $('plan').scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
});

$('tr').addEventListener('change', ev => {
  const c = ev.target;
  if (c.type !== 'checkbox') return;
  if (c.checked) done[c.dataset.k] = 1; else delete done[c.dataset.k];
  save(); update();
});

$('rs').addEventListener('click', () => {
  Object.keys(done).forEach(k => { if (k.startsWith(cur + ':')) delete done[k]; });
  save(); renderPlan();
});

renderAreas();
renderPlan();
</script>
</body>
</html>
